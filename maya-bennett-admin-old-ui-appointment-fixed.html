<script>window.MAYA_SUPABASE_URL="https://irdzajojyshafxqczmup.supabase.co";window.MAYA_SUPABASE_PUBLISHABLE_KEY="sb_publishable_TI_uAtOATglnwKnCQFrsjQ_ZIkLZn2H";</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
:root{--forest:#174d46;--forest2:#2b6b62;--ink:#27322f;--muted:#7a8581;--paper:#f4f6f3;--white:#fff;--sage:#e0eee8;--sage2:#eff6f2;--peach:#f5d0c1;--butter:#f4e0a3;--rose:#f4e1de;--line:#e3e8e4;--red:#a14b43;--shadow:0 16px 45px rgba(25,55,48,.07);--sans:'DM Sans',system-ui,sans-serif;--serif:'Playfair Display',Georgia,serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px var(--sans)}button,input,textarea,select{font:inherit}.hidden{display:none!important}.muted{color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 15%,#dcebe4 0 17%,transparent 37%),radial-gradient(circle at 90% 85%,#f5d0c1 0 14%,transparent 35%),#f8f6f1}.login-card{width:min(470px,100%);background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:30px;padding:44px;box-shadow:var(--shadow)}.login h1{font:600 43px/1.05 var(--serif);color:var(--forest);margin:18px 0 10px}.login p{line-height:1.7}.logo-mark{width:52px;height:52px;border-radius:17px;background:var(--forest);color:#fff;display:grid;place-items:center;font:600 22px var(--serif)}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.7px;font-weight:700;color:var(--forest2)}
.field{margin:14px 0}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;color:#697570;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px;outline:0;color:var(--ink);transition:.2s}.field textarea{min-height:110px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--forest2);box-shadow:0 0 0 4px rgba(43,107,98,.08)}
.btn{border:0;border-radius:12px;background:var(--forest);color:#fff;padding:11px 16px;font-weight:700;transition:.2s;cursor:pointer}.btn:hover{transform:translateY(-1px);background:#103f3a}.btn.secondary{background:var(--sage2);color:var(--forest)}.btn.danger{background:var(--rose);color:var(--red)}.btn.small{padding:8px 11px;font-size:11px;border-radius:10px}.error{color:var(--red);font-size:12px;margin-top:10px}
.app{display:none;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:252px;background:var(--forest);color:#fff;padding:24px 17px;display:flex;flex-direction:column;z-index:20}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 30px}.brand b{font-size:14px}.brand span{display:block;font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:#b4d2cb;margin-top:4px}.brand:before{content:'M';width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center;font:600 18px var(--serif)}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c8ddd8;text-align:left;padding:12px 13px;border-radius:12px;font-weight:600;cursor:pointer;transition:.2s}.nav button:hover,.nav button.active{background:rgba(255,255,255,.11);color:#fff}.sidebar-bottom{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.main{margin-left:252px;min-height:100vh;padding:29px 34px 60px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}.top h2{font:600 31px/1.1 var(--serif);color:var(--forest);margin:4px 0 0}.user{font-size:11px;color:var(--muted)}
.grid{display:grid;gap:16px}.cards4{grid-template-columns:repeat(4,1fr)}.stat-card,.panel{background:var(--white);border:1px solid var(--line);border-radius:19px;box-shadow:0 8px 30px rgba(30,55,48,.035)}.stat-card{padding:20px;min-height:132px;position:relative;overflow:hidden}.stat-card:after{content:'';position:absolute;width:72px;height:72px;border-radius:50%;right:-23px;top:-23px;background:var(--sage2)}.stat-card:nth-child(2):after{background:#fff0e8}.stat-card:nth-child(3):after{background:#f8edc7}.stat-card:nth-child(4):after{background:#eee8f4}.stat-card small{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:700}.stat-card strong{display:block;font:600 34px var(--serif);color:var(--forest);margin-top:9px}.stat-card .muted{font-size:11px}.panel{padding:21px;margin-top:17px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:17px}.panel-head h3{font:600 21px var(--serif);color:var(--forest);margin:0}.panel-head p{margin:5px 0 0;font-size:11px;color:var(--muted)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}.table th{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.table tbody tr:hover{background:#fafcfb}.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:var(--sage2);color:var(--forest);font-size:9px;text-transform:uppercase;letter-spacing:.7px;font-weight:800}.badge.new,.badge.requested{background:#fff1d3;color:#7a5b17}.badge.closed,.badge.completed{background:#eceeeb;color:#66716d}.badge.spam,.badge.cancelled,.badge.no_show{background:var(--rose);color:var(--red)}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:10px;padding:7px 9px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.form-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.empty{padding:36px;text-align:center;color:var(--muted);font-size:12px}.empty strong{display:block;color:var(--forest);font:600 20px var(--serif);margin-bottom:5px}.toast{position:fixed;right:25px;bottom:25px;background:var(--forest);color:#fff;border-radius:13px;padding:13px 17px;font-size:12px;box-shadow:var(--shadow);z-index:100}
.quick{display:grid;gap:9px}.quick button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;text-align:left;font-weight:700;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between}.quick button:hover{background:var(--sage2);border-color:#bfd0ca}.calendar-list{display:grid;gap:9px}.cal-item{padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;display:flex;gap:12px;align-items:center}.cal-time{min-width:62px;color:var(--forest);font-weight:800;font-size:11px}.cal-info{flex:1}.cal-info b{font-size:12px}.cal-info span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.person{display:flex;align-items:center;gap:9px}.mini-avatar{width:31px;height:31px;border-radius:11px;background:var(--sage);display:grid;place-items:center;color:var(--forest);font-weight:800;font-size:11px}.person b{font-size:12px}.person span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.search{min-width:230px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:12px 14px;background:var(--sage2);border-radius:12px;color:var(--forest);font-size:11px;margin-bottom:15px}.service-card{padding:18px;border:1px solid var(--line);border-radius:16px;background:#fff;margin-bottom:12px}.settings-grid{grid-template-columns:1fr 1fr}.page{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(max-width:1050px){.sidebar{width:220px}.main{margin-left:220px;padding:23px}.cards4{grid-template-columns:1fr 1fr}.settings-grid{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{position:fixed;width:260px;transform:translateX(-100%);transition:.25s}.sidebar.open{transform:none}.main{margin-left:0;padding:18px}.cards4,.two,.three{grid-template-columns:1fr}.top{gap:10px;flex-direction:column}.panel-head{flex-direction:column}.search{min-width:100%}}

</style>
</head>
<body>
<div id="login" class="login"><div class="login-card"><div class="eyebrow">Private practice admin</div><h1>Welcome back.</h1><p class="muted">Sign in to manage enquiries, appointments, availability and the public Maya Bennett Psychology website.</p><form id="loginForm"><div class="field"><label>Email</label><input id="loginEmail" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div><button class="btn" type="submit">Sign in →</button><div id="loginError" class="error"></div></form></div></div>
<div id="app" class="app"><aside class="sidebar"><div class="brand"><b>Maya Bennett</b><span>Psychology · Admin</span></div><div class="nav"><button data-page="dashboard" class="active">Overview</button><button data-page="inquiries">Enquiries</button><button data-page="appointments">Appointments</button><button data-page="availability">Availability</button><button data-page="website">Website content</button><button data-page="services">Services</button></div><div class="sidebar-bottom"><button id="logout" class="nav">Sign out</button></div></aside><main class="main"><div class="top"><div><div class="eyebrow">Maya Bennett Psychology</div><h2 id="pageTitle">Overview</h2></div><div id="userEmail" class="user"></div></div><section id="dashboard" class="page"></section><section id="inquiries" class="page hidden"></section><section id="appointments" class="page hidden"></section><section id="availability" class="page hidden"></section><section id="website" class="page hidden"></section><section id="services" class="page hidden"></section></main></div><div id="toast" class="toast hidden"></div>
<script>
const {createClient}=supabase;
const sb=createClient(window.MAYA_SUPABASE_URL,window.MAYA_SUPABASE_PUBLISHABLE_KEY);
let currentUser=null, currentPage='dashboard';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2400)}
async function isAdmin(){if(!currentUser||!currentUser.id)return {ok:false,reason:'No authenticated user session was returned by Supabase.'};const {data,error}=await sb.from('admin_profiles').select('user_id,full_name,role').eq('user_id',currentUser.id).maybeSingle();if(error)return {ok:false,reason:'Admin profile check failed: '+error.message};if(!data)return {ok:false,reason:'Login succeeded, but this email is not listed in admin_profiles. Add this User UID to admin_profiles: '+currentUser.id};return {ok:true,profile:data}}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session){currentUser=session.user;if(await isAdmin())showApp();else await sb.auth.signOut()}else showLogin();}
function showLogin(){$('login').style.display='grid';$('app').style.display='none'}
function showApp(){$('login').style.display='none';$('app').style.display='flex';$('userEmail').textContent=currentUser.email||'';loadPage('dashboard')}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const email=$('loginEmail').value.trim();const password=$('loginPassword').value;if(!email||!password){$('loginError').textContent='Please enter both email and password.';return}try{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){$('loginError').textContent='Supabase login: '+error.message;return}if(!data?.user){$('loginError').textContent='Supabase did not return a user session. Please try again.';return}currentUser=data.user;const admin=await isAdmin();if(!admin.ok){$('loginError').textContent=admin.reason;await sb.auth.signOut();currentUser=null;return}showApp()}catch(e){$('loginError').textContent='Login error: '+(e?.message||String(e))}});
$('logout').addEventListener('click',async()=>{await sb.auth.signOut();currentUser=null;showLogin()});
document.querySelectorAll('.nav button[data-page]').forEach(b=>b.addEventListener('click',()=>loadPage(b.dataset.page)));
document.addEventListener('click',e=>{if(e.target.closest('#addAppointmentBtn')){e.preventDefault();window.newAppointment();}});
async function loadPage(page){currentPage=page;document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(page).classList.remove('hidden');document.querySelectorAll('.nav button[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));$('pageTitle').textContent=page==='dashboard'?'Overview':({inquiries:'Enquiries',appointments:'Appointments',availability:'Availability',website:'Website editor',services:'Services'}[page]||page);if(page==='dashboard')return renderDashboard();if(page==='inquiries')return renderInquiries();if(page==='appointments')return renderAppointments();if(page==='availability')return renderAvailability();if(page==='website')return renderWebsite();if(page==='services')return renderServices()}
async function renderDashboard(){const [i,a,s]=await Promise.all([sb.from('inquiries').select('id,status,created_at').order('created_at',{ascending:false}),sb.from('appointments').select('id,status,starts_at').order('starts_at',{ascending:true}),sb.from('services').select('id').eq('active',true)]);const inq=i.data||[],apps=a.data||[];const upcoming=apps.filter(x=>new Date(x.starts_at)>new Date()&&x.status!=='cancelled').slice(0,5);$('dashboard').innerHTML=`<div class="grid cards4"><div class="stat-card"><small>New enquiries</small><strong>${inq.filter(x=>x.status==='new').length}</strong></div><div class="stat-card"><small>Total enquiries</small><strong>${inq.length}</strong></div><div class="stat-card"><small>Upcoming appointments</small><strong>${upcoming.length}</strong></div><div class="stat-card"><small>Active services</small><strong>${(s.data||[]).length}</strong></div></div><div class="panel"><div class="panel-head"><h3>Recent enquiries</h3><button class="btn secondary" onclick="loadPage('inquiries')">View all</button></div>${inquiryTable(inq.slice(0,6))}</div><div class="panel"><div class="panel-head"><h3>Upcoming appointments</h3><button class="btn secondary" onclick="loadPage('appointments')">Manage</button></div>${appointmentTable(upcoming)}</div>`}
function inquiryTable(rows){if(!rows.length)return '<div class="empty">No enquiries yet.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Preference</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${new Date(r.created_at).toLocaleString()}</td><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.preference||'')}</td><td><span class="badge ${r.status}">${r.status.replace('_',' ')}</span></td><td><button class="btn secondary" onclick="viewInquiry('${r.id}')">Open</button></td></tr>`).join('')}</tbody></table></div>`}
async function renderInquiries(){const {data,error}=await sb.from('inquiries').select('*').order('created_at',{ascending:false});if(error)return $('inquiries').innerHTML='<div class="panel">'+esc(error.message)+'</div>';$('inquiries').innerHTML=`<div class="panel"><div class="panel-head"><h3>Consultation enquiries</h3><button class="btn secondary" onclick="renderInquiries()">Refresh</button></div>${inquiryTable(data||[])}</div>`}
window.viewInquiry=async id=>{const {data,error}=await sb.from('inquiries').select('*').eq('id',id).single();if(error)return toast(error.message);const status=['new','contacted','consultation_scheduled','closed','spam'];$('inquiries').innerHTML=`<div class="panel"><div class="panel-head"><h3>${esc(data.name)}</h3><button class="btn secondary" onclick="renderInquiries()">← Back</button></div><div class="grid two"><div><div class="field"><label>Name</label><input id="inqName" value="${esc(data.name)}"></div><div class="field"><label>Email</label><input id="inqEmail" value="${esc(data.email)}"></div><div class="field"><label>Phone</label><input id="inqPhone" value="${esc(data.phone||'')}"></div><div class="field"><label>Preference</label><select id="inqPref"><option value="video" ${data.preference==='video'?'selected':''}>Video</option><option value="in_person" ${data.preference==='in_person'?'selected':''}>In-person</option></select></div></div><div><div class="field"><label>Status</label><select id="inqStatus">${status.map(x=>`<option value="${x}" ${data.status===x?'selected':''}>${x.replace('_',' ')}</option>`).join('')}</select></div><div class="field"><label>Message</label><textarea id="inqMessage">${esc(data.message||'')}</textarea></div><div class="field"><label>Private admin notes</label><textarea id="inqNotes">${esc(data.admin_notes||'')}</textarea></div></div></div><div class="form-actions"><button class="btn" onclick="saveInquiry('${id}')">Save changes</button><button class="btn danger" onclick="deleteInquiry('${id}')">Delete</button></div><p class="muted">Received ${new Date(data.created_at).toLocaleString()} · source: ${esc(data.source)}</p></div>`}
window.saveInquiry=async id=>{const patch={name:$('inqName').value.trim(),email:$('inqEmail').value.trim(),phone:$('inqPhone').value.trim()||null,preference:$('inqPref').value,status:$('inqStatus').value,message:$('inqMessage').value.trim()||null,admin_notes:$('inqNotes').value.trim()||null};const {error}=await sb.from('inquiries').update(patch).eq('id',id);if(error)return toast(error.message);toast('Enquiry saved');renderInquiries()};
window.deleteInquiry=async id=>{if(!confirm('Delete this enquiry?'))return;const {error}=await sb.from('inquiries').delete().eq('id',id);if(error)return toast(error.message);toast('Enquiry deleted');renderInquiries()};
function appointmentTable(rows){if(!rows.length)return '<div class="empty">No upcoming appointments.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>When</th><th>Name</th><th>Mode</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${new Date(r.starts_at).toLocaleString()}</td><td>${esc(r.name)}</td><td>${esc(r.mode)}</td><td><span class="badge ${r.status}">${r.status.replace('_',' ')}</span></td><td><button class="btn secondary" onclick="editAppointment('${r.id}')">Open</button></td></tr>`).join('')}</tbody></table></div>`}
async function renderAppointments(){const {data,error}=await sb.from('appointments').select('*').order('starts_at',{ascending:true});if(error)return $('appointments').innerHTML='<div class="panel">'+esc(error.message)+'</div>';$('appointments').innerHTML=`<div class="panel"><div class="panel-head"><h3>Appointments</h3><button id="addAppointmentBtn" class="btn" type="button">+ New appointment</button></div>${appointmentTable(data||[])}</div>`;const add=$('addAppointmentBtn');if(add)add.addEventListener('click',()=>window.newAppointment())}
window.newAppointment=()=>{$('appointments').innerHTML=`<div class="panel"><div class="panel-head"><h3>New appointment</h3><button class="btn secondary" onclick="renderAppointments()">← Back</button></div><div class="grid two"><div><div class="field"><label>Name</label><input id="apName"></div><div class="field"><label>Email</label><input id="apEmail" type="email"></div><div class="field"><label>Phone</label><input id="apPhone"></div><div class="field"><label>Mode</label><select id="apMode"><option value="video">Video</option><option value="in_person">In-person</option></select></div></div><div><div class="field"><label>Start</label><input id="apStart" type="datetime-local"></div><div class="field"><label>End</label><input id="apEnd" type="datetime-local"></div><div class="field"><label>Status</label><select id="apStatus"><option>requested</option><option>confirmed</option><option>completed</option><option>cancelled</option><option>no_show</option></select></div><div class="field"><label>Notes</label><textarea id="apNotes"></textarea></div></div></div><div class="form-actions"><button class="btn" onclick="createAppointment()">Create appointment</button></div></div>`}
window.createAppointment=async()=>{const p={name:$('apName').value.trim(),email:$('apEmail').value.trim(),phone:$('apPhone').value.trim()||null,mode:$('apMode').value,starts_at:new Date($('apStart').value).toISOString(),ends_at:new Date($('apEnd').value).toISOString(),status:$('apStatus').value,notes:$('apNotes').value.trim()||null};const {error}=await sb.from('appointments').insert(p);if(error)return toast(error.message);toast('Appointment created');renderAppointments()};
window.editAppointment=async id=>{const {data,error}=await sb.from('appointments').select('*').eq('id',id).single();if(error)return toast(error.message);const local=x=>new Date(x).toISOString().slice(0,16);$('appointments').innerHTML=`<div class="panel"><div class="panel-head"><h3>${esc(data.name)}</h3><button class="btn secondary" onclick="renderAppointments()">← Back</button></div><div class="grid two"><div><div class="field"><label>Name</label><input id="apName" value="${esc(data.name)}"></div><div class="field"><label>Email</label><input id="apEmail" value="${esc(data.email)}"></div><div class="field"><label>Phone</label><input id="apPhone" value="${esc(data.phone||'')}"></div><div class="field"><label>Mode</label><select id="apMode"><option value="video" ${data.mode==='video'?'selected':''}>Video</option><option value="in_person" ${data.mode==='in_person'?'selected':''}>In-person</option></select></div></div><div><div class="field"><label>Start</label><input id="apStart" type="datetime-local" value="${local(data.starts_at)}"></div><div class="field"><label>End</label><input id="apEnd" type="datetime-local" value="${local(data.ends_at)}"></div><div class="field"><label>Status</label><select id="apStatus">${['requested','confirmed','completed','cancelled','no_show'].map(x=>`<option ${data.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Notes</label><textarea id="apNotes">${esc(data.notes||'')}</textarea></div></div></div><div class="form-actions"><button class="btn" onclick="saveAppointment('${id}')">Save</button><button class="btn danger" onclick="deleteAppointment('${id}')">Delete</button></div></div>`}
window.saveAppointment=async id=>{const p={name:$('apName').value.trim(),email:$('apEmail').value.trim(),phone:$('apPhone').value.trim()||null,mode:$('apMode').value,starts_at:new Date($('apStart').value).toISOString(),ends_at:new Date($('apEnd').value).toISOString(),status:$('apStatus').value,notes:$('apNotes').value.trim()||null};const {error}=await sb.from('appointments').update(p).eq('id',id);if(error)return toast(error.message);toast('Appointment saved');renderAppointments()};
window.deleteAppointment=async id=>{if(!confirm('Delete this appointment?'))return;const {error}=await sb.from('appointments').delete().eq('id',id);if(error)return toast(error.message);toast('Appointment deleted');renderAppointments()};
async function renderAvailability(){const {data,error}=await sb.from('availability').select('*').order('day_of_week').order('start_time');if(error)return $('availability').innerHTML='<div class="panel">'+esc(error.message)+'</div>';const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];$('availability').innerHTML=`<div class="panel"><div class="panel-head"><h3>Weekly availability</h3><button class="btn" onclick="addAvailability()">+ Add window</button></div>${data?.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Day</th><th>Start</th><th>End</th><th>Mode</th><th>Active</th><th></th></tr></thead><tbody>${data.map(r=>`<tr><td>${days[r.day_of_week]}</td><td>${r.start_time}</td><td>${r.end_time}</td><td>${r.mode}</td><td>${r.active?'Yes':'No'}</td><td><div class="actions"><button class="btn secondary" onclick="toggleAvailability('${r.id}',${r.active})">${r.active?'Disable':'Enable'}</button><button class="btn danger" onclick="deleteAvailability('${r.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No availability windows yet.</div>'}</div>`}
window.addAvailability=async()=>{const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];$('availability').innerHTML=`<div class="panel"><div class="panel-head"><h3>Add availability</h3><button class="btn secondary" onclick="renderAvailability()">← Back</button></div><div class="grid three"><div class="field"><label>Day</label><select id="avDay">${days.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></div><div class="field"><label>Start</label><input id="avStart" type="time" value="09:00"></div><div class="field"><label>End</label><input id="avEnd" type="time" value="17:00"></div></div><div class="field"><label>Mode</label><select id="avMode"><option value="video">Video</option><option value="in_person">In-person</option></select></div><button class="btn" onclick="saveAvailability()">Add window</button></div>`}
window.saveAvailability=async()=>{const p={day_of_week:+$('avDay').value,start_time:$('avStart').value,end_time:$('avEnd').value,mode:$('avMode').value,active:true};const {error}=await sb.from('availability').insert(p);if(error)return toast(error.message);toast('Availability added');renderAvailability()};window.toggleAvailability=async(id,active)=>{const {error}=await sb.from('availability').update({active:!active}).eq('id',id);if(error)return toast(error.message);renderAvailability()};window.deleteAvailability=async id=>{if(!confirm('Delete this availability window?'))return;const {error}=await sb.from('availability').delete().eq('id',id);if(error)return toast(error.message);renderAvailability()};
async function renderWebsite(){const {data,error}=await sb.from('site_settings').select('*').eq('id',true).single();if(error)return $('website').innerHTML='<div class="panel">'+esc(error.message)+'</div>';const f=(id,label,value,type='text')=>`<div class="field"><label>${label}</label>${type==='textarea'?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" value="${esc(value)}">`}</div>`;$('website').innerHTML=`<div class="panel"><div class="panel-head"><h3>Website content</h3><button class="btn" onclick="saveWebsite()">Save changes</button></div><div class="grid two">${f('practice_name','Practice name',data.practice_name)}${f('therapist_name','Therapist name',data.therapist_name)}${f('email','Email',data.email)}${f('office_address','Office address',data.office_address)}${f('sessions_text','Sessions text',data.sessions_text)}${f('topbar_text','Top bar',data.topbar_text)}${f('hero_eyebrow','Hero eyebrow',data.hero_eyebrow)}${f('hero_title','Hero title',data.hero_title)}${f('hero_description','Hero description',data.hero_description,'textarea')}${f('hero_status_title','Hero status title',data.hero_status_title)}${f('hero_status_text','Hero status text',data.hero_status_text,'textarea')}${f('hero_quote','Hero quote',data.hero_quote,'textarea')}${f('about_kicker','About kicker',data.about_kicker)}${f('about_title','About title',data.about_title)}${f('about_paragraph_1','About paragraph 1',data.about_paragraph_1,'textarea')}${f('about_paragraph_2','About paragraph 2',data.about_paragraph_2,'textarea')}${f('about_paragraph_3','About paragraph 3',data.about_paragraph_3,'textarea')}${f('about_caption','About image caption',data.about_caption)}${f('degree_text','Degree',data.degree_text)}${f('degree_school','Degree school',data.degree_school)}${f('license_text','License',data.license_text)}${f('license_detail','License detail',data.license_detail)}${f('process_intro','Process intro',data.process_intro,'textarea')}${f('contact_intro','Contact intro',data.contact_intro,'textarea')}${f('hero_image_url','Hero image URL',data.hero_image_url)}${f('hero_secondary_image_url','Hero secondary image URL',data.hero_secondary_image_url)}${f('about_image_url','About image URL',data.about_image_url)}</div></div>`}
window.saveWebsite=async()=>{const ids=['practice_name','therapist_name','email','office_address','sessions_text','topbar_text','hero_eyebrow','hero_title','hero_description','hero_status_title','hero_status_text','hero_quote','about_kicker','about_title','about_paragraph_1','about_paragraph_2','about_paragraph_3','about_caption','degree_text','degree_school','license_text','license_detail','process_intro','contact_intro','hero_image_url','hero_secondary_image_url','about_image_url'];const p={};ids.forEach(id=>p[id]=$(id).value.trim());const {error}=await sb.from('site_settings').update(p).eq('id',true);if(error)return toast(error.message);toast('Website content saved')};
async function renderServices(){const {data,error}=await sb.from('services').select('*').order('sort_order');if(error)return $('services').innerHTML='<div class="panel">'+esc(error.message)+'</div>';$('services').innerHTML=`<div class="panel"><div class="panel-head"><h3>Ways I can help</h3><button class="btn" onclick="newService()">+ Add service</button></div>${data?.length?data.map(r=>`<div class="panel" style="margin:10px 0;background:#f6f8f6"><div class="grid two"><div><div class="field"><label>Tag</label><input id="tag_${r.id}" value="${esc(r.tag)}"></div><div class="field"><label>Title</label><input id="title_${r.id}" value="${esc(r.title)}"></div><div class="field"><label>Description</label><textarea id="desc_${r.id}">${esc(r.description)}</textarea></div></div><div><div class="field"><label>Image URL</label><input id="img_${r.id}" value="${esc(r.image_url)}"></div><div class="field"><label>Sort order</label><input id="sort_${r.id}" type="number" value="${r.sort_order}"></div><div class="field"><label>Active</label><select id="active_${r.id}"><option value="true" ${r.active?'selected':''}>Yes</option><option value="false" ${!r.active?'selected':''}>No</option></select></div></div></div><div class="form-actions"><button class="btn" onclick="saveService('${r.id}')">Save</button><button class="btn danger" onclick="deleteService('${r.id}')">Delete</button></div></div>`).join(''):'<div class="empty">No services yet.</div>'}</div>`}
window.newService=()=>{$('services').insertAdjacentHTML('beforeend',`<div class="panel"><h3>New service</h3><div class="grid two"><div><div class="field"><label>Tag</label><input id="newTag"></div><div class="field"><label>Title</label><input id="newTitle"></div><div class="field"><label>Description</label><textarea id="newDesc"></textarea></div></div><div><div class="field"><label>Image URL</label><input id="newImg"></div><div class="field"><label>Sort order</label><input id="newSort" type="number" value="4"></div></div></div><button class="btn" onclick="createService()">Create service</button></div>`)};
window.createService=async()=>{const p={tag:$('newTag').value,title:$('newTitle').value,description:$('newDesc').value,image_url:$('newImg').value,sort_order:+$('newSort').value,active:true};const {error}=await sb.from('services').insert(p);if(error)return toast(error.message);toast('Service created');renderServices()};window.saveService=async id=>{const p={tag:$('tag_'+id).value,title:$('title_'+id).value,description:$('desc_'+id).value,image_url:$('img_'+id).value,sort_order:+$('sort_'+id).value,active:$('active_'+id).value==='true'};const {error}=await sb.from('services').update(p).eq('id',id);if(error)return toast(error.message);toast('Service saved');renderServices()};window.deleteService=async id=>{if(!confirm('Delete this service?'))return;const {error}=await sb.from('services').delete().eq('id',id);if(error)return toast(error.message);toast('Service deleted');renderServices()};
boot();
</script>
</body></html>
